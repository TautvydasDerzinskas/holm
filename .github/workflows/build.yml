name: Build & Push Docker Image

on:
  push:
    branches: [dev, main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Alpha image — pushed on dev merge
  alpha:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=alpha
            type=sha

      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Prod image — pushed on main merge, tagged with the next version
  prod:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # tags are the version source

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version comes from git tags, not from a commit on main: the
      # branch ruleset only accepts changes through a pull request, so a
      # bump commit pushed from here would be rejected. Next version is the
      # latest v* tag plus one patch, unless package.json was raised past it
      # by hand (a minor or major release), in which case that is used as-is.
      - name: Next version
        id: bump
        run: |
          CURRENT=$(node -p 'require("./package.json").version')
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -n 1)
          if [ -z "$LATEST" ]; then
            NEW_VERSION="$CURRENT"
          elif [ "$CURRENT" != "$LATEST" ] && [ "$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | tail -n 1)" = "$CURRENT" ]; then
            NEW_VERSION="$CURRENT"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          # Baked into the image only; not committed.
          node -e "const p=require('./package.json'); p.version='$NEW_VERSION'; require('fs').writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n')"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=stable
            type=raw,value=${{ steps.bump.outputs.version }}
            type=sha

      - uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag release
        run: |
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"

      # A GitHub Release for the tag, so Holm's update check (and anyone
      # watching the repo) sees it. The notes are that version's section of
      # CHANGELOG.md; an automatic patch bump has none, so it gets one line.
      # Under them goes the image this run pushed, by tag and by digest.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.bump.outputs.version }}
          IMG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          awk -v v="$V" '
            /^## / { if (on) exit; h = $0; sub(/^## v?/, "", h); split(h, a, /[ \t]/); on = (a[1] == v); next }
            on
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "Maintenance build of Holm $V from ${GITHUB_SHA::7}. Notable changes are in CHANGELOG.md." > notes.md
          fi
          # Lowercased, as metadata-action pushed it.
          IMG=${IMG,,}
          cat >> notes.md <<EOF

          ### Docker image

          \`\`\`
          docker pull $IMG:$V
          \`\`\`

          Pinned: \`$IMG@$DIGEST\` (linux/amd64, linux/arm64)
          EOF
          gh release create "v$V" --title "Holm $V" --notes-file notes.md --verify-tag
